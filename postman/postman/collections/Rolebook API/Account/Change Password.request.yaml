$kind: http-request
url: "{{baseUrl}}/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "secret123",
      "newPassword": "evenbettersecret"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 1000
