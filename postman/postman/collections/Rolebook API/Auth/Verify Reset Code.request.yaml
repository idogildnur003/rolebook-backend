$kind: http-request
url: "{{baseUrl}}/auth/verify-reset-code"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{verifyEmail}}",
      "code": "000000"
    }
scripts:
  - type: afterResponse
    code: |-
      // Replace "code" above with the 6-digit code from the password-reset email
      // (printed to the server log when RESEND_API_KEY is unset). On success the
      // server returns a single-use { resetToken }, captured below for Reset Password.
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      if (json.resetToken) {
        pm.environment.set("resetToken", json.resetToken);
      }
    language: text/javascript
order: 1850
