$kind: http-request
url: "{{baseUrl}}/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{verifyEmail}}"
    }
scripts:
  - type: afterResponse
    code: |-
      // Always returns 200 {"status":"reset_requested"} regardless of whether the
      // account exists (no account enumeration). A 6-digit code is emailed only
      // when the account exists and the 60s resend cooldown has elapsed (printed
      // to the server log when RESEND_API_KEY is unset).
      pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 1800
