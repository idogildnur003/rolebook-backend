$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "dm@example.com",
      "password": "secret123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 2xx", () => pm.response.to.be.success);
      const json = pm.response.json();
      // Verification disabled (no RESEND_API_KEY): a JWT is issued directly.
      if (json.token) {
        pm.environment.set("token", json.token);
        pm.environment.set("userId", json.userId);
      }
      // Verification enabled: response is {status:"verification_required", email}.
      // Stash the email so the Verify Email / Resend requests can reuse it.
      if (json.email) {
        pm.environment.set("verifyEmail", json.email);
      }
    language: text/javascript
order: 1000
