$kind: http-request
url: "{{baseUrl}}/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{verifyEmail}}",
      "resetToken": "{{resetToken}}",
      "newPassword": "new-secret123"
    }
scripts:
  - type: afterResponse
    code: |-
      // Consumes the single-use { resetToken } from Verify Reset Code and sets a
      // new password. Returns 204 on success. Afterwards any JWT issued before the
      // reset is revoked — old tokens return 401.
      pm.test("Status 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 1900
