$kind: http-request
url: "{{baseUrl}}/campaigns/{{campaignId}}/companions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Ash",
      "creatureType": "Wolf"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.environment.set("companionId", json.id);
    language: text/javascript
order: 1000
