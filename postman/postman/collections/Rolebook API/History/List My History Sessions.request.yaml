$kind: http-request
url: "{{baseUrl}}/campaigns/{{campaignId}}/history/sessions"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test("Has sessions array", () => pm.expect(json.sessions).to.be.an("array"));
    language: text/javascript
order: 2000
