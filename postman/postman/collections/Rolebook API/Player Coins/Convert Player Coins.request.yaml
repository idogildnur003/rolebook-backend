$kind: http-request
url: "{{baseUrl}}/players/{{playerId}}/coins/convert"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "from": "gp",
      "to": "sp",
      "amount": 2
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
