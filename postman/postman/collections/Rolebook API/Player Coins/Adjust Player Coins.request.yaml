$kind: http-request
url: "{{baseUrl}}/players/{{playerId}}/coins"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "gp": 5,
      "sp": -3
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
