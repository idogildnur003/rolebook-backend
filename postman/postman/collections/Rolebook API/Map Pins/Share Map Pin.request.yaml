$kind: http-request
url: "{{baseUrl}}/campaigns/{{campaignId}}/map-pins/{{mapPinId}}/share"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "recipientPlayerIds": ["{{otherPlayerId}}"],
      "sharedWithAll": false,
      "note": "",
      "cascadeEntity": true
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
